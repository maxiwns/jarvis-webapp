
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101113">
<title>JARVIS 0.9 – Anmeldung</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
:root{
  color-scheme:dark;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:#101113;
  color:#f3f3f4
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100svh;
  display:grid;
  place-items:center;
  padding:22px;
  background:radial-gradient(ellipse at 50% 30%,#1d1e21 0,#101113 65%)
}
.login{
  width:100%;
  max-width:416px;
  background:#191a1d;
  border:1px solid #35363a;
  border-radius:20px;
  padding:clamp(24px,5vw,38px);
  box-shadow:0 24px 70px #0005
}
.brand{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:14px;
  margin-bottom:30px
}
.core{
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  position:relative
}
.core:before{
  content:"";
  position:absolute;
  inset:2px;
  border:1px solid #77797e;
  border-radius:50%;
  animation:orbit 14s linear infinite
}
.core:after{
  content:"";
  width:11px;
  height:11px;
  border-radius:50%;
  background:#e8e8eb;
  box-shadow:0 0 0 8px #ffffff08,0 0 0 15px #ffffff05
}
.core span{
  position:absolute;
  width:5px;
  height:5px;
  top:0;
  left:19px;
  border-radius:50%;
  background:#b4b4b9
}
@keyframes orbit{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){
  .core:before{animation:none}
}
h1{
  margin:0;
  font-size:27px;
  font-weight:680;
  letter-spacing:.12em
}
.tag{
  font-size:11px;
  color:#a0a1a6;
  border:1px solid #414247;
  border-radius:5px;
  padding:3px 6px;
  vertical-align:middle;
  letter-spacing:0;
  font-weight:500
}
.subtitle{
  margin:0;
  color:#a5a6ad;
  text-align:center;
  font-size:13px;
  line-height:1.6
}
label{
  display:block;
  margin-bottom:10px;
  font-size:13px;
  color:#dedee0
}
input{
  width:100%;
  background:#101113;
  border:1px solid #414248;
  color:#f7f7f7;
  padding:14px;
  border-radius:10px;
  font:inherit;
  font-size:15px
}
input:focus{
  outline:2px solid #a4a5aa;
  outline-offset:2px
}
.turnstile{
  margin-top:22px;
  display:flex;
  justify-content:center;
  min-height:65px
}
button{
  width:100%;
  margin-top:20px;
  background:#e5e5e7;
  border:1px solid #e5e5e7;
  border-radius:10px;
  color:#141518;
  padding:14px;
  font:inherit;
  font-size:14px;
  font-weight:650;
  cursor:pointer
}
button:hover:not(:disabled){background:#fff}
button:disabled{opacity:.55;cursor:wait}
button:focus-visible{
  outline:2px solid #fff;
  outline-offset:3px
}
#message{
  margin-top:16px;
  color:#f2a2a2;
  text-align:center;
  min-height:20px;
  font-size:13px;
  overflow-wrap:anywhere
}
small{
  display:block;
  margin-top:22px;
  text-align:center;
  color:#777980;
  font-size:11px
}
</style>
</head>
<body>
<main class="login">
<header class="brand">
  <div class="core" aria-hidden="true"><span></span></div>
  <h1>JARVIS <span class="tag">0.9</span></h1>
  <p class="subtitle">
    Persönlicher KI-Assistent
    <br>
    Geschützter Zugang
  </p>
</header>

<form id="loginForm">
  <label for="password">Zugangspasswort</label>
  <input
    type="password"
    id="password"
    autocomplete="current-password"
    required
    maxlength="256"
    placeholder="Passwort eingeben"
  >
  <div class="turnstile">
    <div
      class="cf-turnstile"
      data-sitekey="0x4AAAAAAFlRYWMJjQEx8x7e"
      data-action="login"
      data-theme="dark"
    ></div>
  </div>
  <button id="loginButton" type="submit">
    Bei JARVIS anmelden
  </button>
</form>

<div id="message" role="status" aria-live="polite"></div>
<small>JARVIS 0.9 · Private Testversion</small>
</main>

<script>
const form = document.getElementById('loginForm');
const button = document.getElementById('loginButton');
const message = document.getElementById('message');

form.addEventListener('submit', async event => {
  event.preventDefault();

  const password = document.getElementById('password').value;
  const token = window.turnstile?.getResponse();

  if (!token) {
    message.textContent = 'Bitte Sicherheitsprüfung abschließen.';
    return;
  }

  button.disabled = true;
  message.style.color = '#b7b8bd';
  message.textContent = 'Anmeldung wird geprüft ...';

  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      credentials: 'same-origin',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        password,
        turnstileToken: token
      })
    });

    if (!response.ok) {
      const errorData = await response.json().catch(() => ({}));
      throw new Error(
        errorData.error || 'Anmeldung fehlgeschlagen.'
      );
    }

    message.style.color = '#8cdbb1';
    message.textContent = 'Anmeldung erfolgreich.';

    window.location.replace(
      '/JARVIS_0_9_Complete_Preview.html'
    );

  } catch (error) {
    message.textContent = error.message;
    message.style.color = '#f2a2a2';
    window.turnstile?.reset();
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
