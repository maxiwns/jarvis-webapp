
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>JARVIS – KI-Speichertest</title>
<style>
body {
  font-family: system-ui, sans-serif;
  background: #141414;
  color: #eee;
  max-width: 650px;
  margin: auto;
  padding: 24px;
}
textarea, button {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  margin-top: 12px;
  border-radius: 10px;
  font: inherit;
}
textarea {
  background: #252525;
  border: 1px solid #555;
  color: white;
  min-height: 100px;
}
button {
  background: #eee;
  color: #151515;
  border: 0;
  font-weight: bold;
}
button:disabled {
  opacity: .5;
}
pre {
  background: #252525;
  padding: 16px;
  border-radius: 10px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
</style>
</head>
<body>

<h2>JARVIS – KI-Speichertest</h2>
<p>Test: KI-Antwort und D1-Speicherung</p>

<textarea id="message">Erstelle einen kurzen Arbeitsplan mit drei Schritten.</textarea>

<button id="send">KI und Speicherung testen</button>

<pre id="output">Bereit.</pre>

<script>
const send = document.getElementById("send");
const output = document.getElementById("output");

const chatId =
  "11111111-1111-4111-8111-111111111111";

send.addEventListener("click", async () => {
  send.disabled = true;
  output.textContent = "JARVIS verarbeitet die Nachricht ...";

  try {
    const response = await fetch(
      "/api/conversation-turn",
      {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          chatId,
          message: document.getElementById("message").value,
          model: "auto"
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      output.textContent =
        "Fehler " + response.status + ": " +
        (data.error || "Unbekannt");
      return;
    }

    output.textContent =
      "Gespeichert: " + data.saved +
      "\nModell: " + data.model +
      "\n\nJARVIS:\n" + data.reply;

  } catch (error) {
    output.textContent =
      "Verbindungsfehler: " + error.message;
  } finally {
    send.disabled = false;
  }
});
</script>
</body>
</html>
