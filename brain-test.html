
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>JARVIS – Second Brain Test</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #0b1020;
      color: #f3f6ff;
      max-width: 760px;
      margin: auto;
      padding: 24px;
    }

    h1 {
      color: #75bfff;
    }

    textarea, input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0 18px;
      border: 1px solid #35425e;
      border-radius: 8px;
      background: #151e33;
      color: white;
      font-size: 16px;
    }

    textarea {
      min-height: 180px;
    }

    button {
      background: #2387e8;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
    }

    pre {
      background: #151e33;
      padding: 16px;
      border-radius: 8px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <h1>JARVIS Second Brain</h1>

  <p>
    Test der automatischen KI-Kategorisierung.
    Noch keine Datenbankspeicherung.
  </p>

  <label for="title">Titel</label>
  <input
    id="title"
    value="CRM-Systeme für Unternehmen"
  >

  <label for="content">Wissensinhalt</label>
  <textarea id="content">CRM-Systeme helfen Unternehmen, Kundenkontakte, Vertriebsprozesse und Verkaufschancen zentral zu verwalten. Durch Automatisierung lassen sich wiederkehrende Aufgaben reduzieren und Kundenbeziehungen besser organisieren.</textarea>

  <button id="testButton">
    Automatisch kategorisieren
  </button>
  
  <button id="saveButton" type="button">
    Automatisch im Second Brain speichern
  </button>


  <h2>Ergebnis</h2>
  <pre id="result">Noch kein Test ausgeführt.</pre>
  
<h2>Second Brain durchsuchen</h2>

<input
  id="searchQuery"
  type="text"
  placeholder="Was soll JARVIS finden?"
  value="Support"
>

<button id="searchButton" type="button">
  Wissen suchen
</button>

<h3>Suchergebnisse</h3>
<pre id="searchResult">
Noch keine Suche ausgeführt.
</pre>

<h2>JARVIS – Second Brain fragen</h2>

<input
  id="brainQuestion"
  type="text"
  placeholder="Was möchtest du wissen?"
  value="Was wissen wir über Support?"
>

<button id="askBrainButton" type="button">
  JARVIS fragen
</button>

<h3>Antwort von JARVIS</h3>
<pre id="brainAnswer">
Noch keine Frage gestellt.
</pre>

  <script>
    const button =
      document.getElementById("testButton");

    const output =
      document.getElementById("result");

    button.addEventListener("click", async () => {
      button.disabled = true;
      output.textContent =
        "JARVIS analysiert den Inhalt ...";

      try {
        const response = await fetch(
          "/api/brain-categorize",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            credentials: "same-origin",
            body: JSON.stringify({
              title:
                document.getElementById("title").value,
              content:
                document.getElementById("content").value
            })
          }
        );

        const text = await response.text();

        let result;

        try {
          result = JSON.parse(text);
        } catch {
          throw new Error(
            "HTTP " + response.status +
            ": Keine gültige JSON-Antwort"
          );
        }

        output.textContent = JSON.stringify(
          {
            httpStatus: response.status,
            ...result
          },
          null,
          2
        );

      } catch (error) {
        output.textContent =
          "Fehler: " + error.message;
      } finally {
        button.disabled = false;
      }
    });

    
const saveButton =
  document.getElementById("saveButton");

saveButton.addEventListener("click", async () => {
  saveButton.disabled = true;
  button.disabled = true;

  output.textContent =
    "JARVIS kategorisiert und speichert das Wissen ...";

  try {
    const response = await fetch("/api/brain-save", {
      method: "POST",
      credentials: "same-origin",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        title: document.getElementById("title").value,
        content: document.getElementById("content").value
      })
    });

    const raw = await response.text();
    let result;

    try {
      result = JSON.parse(raw);
    } catch {
      throw new Error(
        "HTTP " + response.status +
        ": Ungültige Serverantwort"
      );
    }

    output.textContent = JSON.stringify(
      {
        httpStatus: response.status,
        ...result
      },
      null,
      2
    );

  } catch (error) {
    output.textContent =
      "Speicherfehler: " + error.message;
  } finally {
    saveButton.disabled = false;
    button.disabled = false;
  }
});

/*
 * JARVIS – Second Brain Suche
 */
const searchButton =
  document.getElementById("searchButton");

const searchResult =
  document.getElementById("searchResult");

searchButton.addEventListener("click", async () => {
  searchButton.disabled = true;

  searchResult.textContent =
    "JARVIS durchsucht sein Second Brain ...";

  try {
    const response = await fetch(
      "/api/brain-search",
      {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          query: document
            .getElementById("searchQuery")
            .value
        })
      }
    );

    const raw = await response.text();

    let data;

    try {
      data = JSON.parse(raw);
    } catch {
      throw new Error(
        "HTTP " + response.status +
        ": Ungültige Serverantwort"
      );
    }

    searchResult.textContent = JSON.stringify(
      {
        httpStatus: response.status,
        ...data
      },
      null,
      2
    );

  } catch (error) {
    searchResult.textContent =
      "Suchfehler: " + error.message;
  } finally {
    searchButton.disabled = false;
  }
});

/*
 * JARVIS – Fragen an das Second Brain
 */

const askBrainButton =
  document.getElementById("askBrainButton");

const brainAnswer =
  document.getElementById("brainAnswer");

askBrainButton.addEventListener("click", async () => {
  askBrainButton.disabled = true;

  brainAnswer.textContent =
    "JARVIS durchsucht sein Wissen und erstellt eine Antwort ...";

  try {
    const response = await fetch("/api/brain-ask", {
      method: "POST",
      credentials: "same-origin",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        question: document
          .getElementById("brainQuestion")
          .value
      })
    });

    const raw = await response.text();

    let result;

    try {
      result = JSON.parse(raw);
    } catch {
      throw new Error(
        "HTTP " + response.status +
        ": Ungültige Serverantwort"
      );
    }

    brainAnswer.textContent = JSON.stringify(
      {
        httpStatus: response.status,
        ...result
      },
      null,
      2
    );

  } catch (error) {
    brainAnswer.textContent =
      "Fehler: " + error.message;
  } finally {
    askBrainButton.disabled = false;
  }
});

    </script>
</body>
</html>
